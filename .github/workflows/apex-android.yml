name: Build ApexPS5 Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Native Android App
        run: |
          python3 - << 'PY'
          import os

          os.makedirs("android-app/app/src/main/java/com/apex/ps5", exist_ok=True)
          os.makedirs("android-app/app/src/main/cpp", exist_ok=True)

          open("android-app/settings.gradle", "w").write(
              'rootProject.name = "ApexPS5"\n'
              'include ":app"\n'
          )

          open("android-app/build.gradle", "w").write(
              'buildscript {\n'
              '  repositories { google(); mavenCentral() }\n'
              '  dependencies { classpath "com.android.tools.build:gradle:8.2.2" }\n'
              '}\n'
              'allprojects {\n'
              '  repositories { google(); mavenCentral() }\n'
              '}\n'
          )

          open("android-app/app/build.gradle", "w").write(
              'plugins { id "com.android.application" }\n'
              'android {\n'
              '  namespace "com.apex.ps5"\n'
              '  compileSdk 34\n'
              '  defaultConfig {\n'
              '    applicationId "com.apex.ps5"\n'
              '    minSdk 26\n'
              '    targetSdk 34\n'
              '    versionCode 1\n'
              '    versionName "1.0"\n'
              '  }\n'
              '  externalNativeBuild {\n'
              '    cmake { path "src/main/cpp/CMakeLists.txt" }\n'
              '  }\n'
              '}\n'
          )

          open("android-app/app/src/main/AndroidManifest.xml", "w").write(
              '<manifest xmlns:android="http://android.com">\n'
              '  <application android:label="ApexPS5">\n'
              '    <activity android:name="com.apex.ps5.MainActivity" android:exported="true">\n'
              '      <intent-filter>\n'
              '        <action android:name="android.intent.action.MAIN" />\n'
              '        <category android:name="android.intent.category.LAUNCHER" />\n'
              '      </intent-filter>\n'
              '    </activity>\n'
              '  </application>\n'
              '</manifest>\n'
          )

          open("android-app/app/src/main/cpp/CMakeLists.txt", "w").write(
              'cmake_minimum_required(VERSION 3.22.1)\n'
              'project("apexps5")\n'
              'add_library(apexps5 SHARED native-lib.cpp)\n'
              'find_library(log-lib log)\n'
              'target_link_libraries(apexps5 ${log-lib})\n'
          )

          open("android-app/app/src/main/cpp/native-lib.cpp", "w").write(
              '#include <jni.h>\n'
              '#include <string>\n'
              '#include <sstream>\n'
              '#include <cstdint>\n'
              'extern "C" JNIEXPORT jstring JNICALL\n'
              'Java_com_apex_ps5_MainActivity_inspectBinary(JNIEnv* env, jobject, jbyteArray data) {\n'
              '  jsize len = env->GetArrayLength(data);\n'
              '  if (len < 64) return env->NewStringUTF("Error: File too small to be a PS5 ELF binary.");\n'
              '  jbyte* bytes = env->GetByteArrayElements(data, nullptr);\n'
              '  uint32_t magic = *reinterpret_cast<uint32_t*>(bytes);\n'
              '  uint64_t entry = *reinterpret_cast<uint64_t*>(bytes + 24);\n'
              '  uint16_t phnum = *reinterpret_cast<uint16_t*>(bytes + 56);\n'
              '  env->ReleaseByteArrayElements(data, bytes, JNI_ABORT);\n'
              '  if (magic != 0x464C457F) return env->NewStringUTF("Invalid or encrypted binary (Expected unencrypted ELF).");\n'
              '  std::ostringstream out;\n'
              '  out << "Valid PS5 ELF Loaded!\\nEntry Point: 0x" << std::hex << entry << "\\nProgram Segments: " << std::dec << phnum;\n'
              '  return env->NewStringUTF(out.str().c_str());\n'
              '}\n'
          )

          open("android-app/app/src/main/java/com/apex/ps5/MainActivity.java", "w").write(
              'package com.apex.ps5;\n'
              'import android.app.Activity;\n'
              'import android.content.Intent;\n'
              'import android.graphics.Bitmap;\n'
              'import android.graphics.BitmapFactory;\n'
              'import android.graphics.Color;\n'
              'import android.graphics.drawable.BitmapDrawable;\n'
              'import android.net.Uri;\n'
              'import android.os.Bundle;\n'
              'import android.view.Gravity;\n'
              'import android.widget.Button;\n'
              'import android.widget.LinearLayout;\n'
              'import android.widget.TextView;\n'
              'import java.io.ByteArrayOutputStream;\n'
              'import java.io.InputStream;\n'
              'public class MainActivity extends Activity {\n'
              '  static { System.loadLibrary("apexps5"); }\n'
              '  public native String inspectBinary(byte[] data);\n'
              '  private LinearLayout rootLayout;\n'
              '  private TextView statusText;\n'
              '  @Override protected void onCreate(Bundle savedInstanceState) {\n'
              '    super.onCreate(savedInstanceState);\n'
              '    rootLayout = new LinearLayout(this);\n'
              '    rootLayout.setOrientation(LinearLayout.VERTICAL);\n'
              '    rootLayout.setGravity(Gravity.CENTER);\n'
              '    rootLayout.setBackgroundColor(Color.parseColor("#0B0F1A"));\n'
              '    rootLayout.setPadding(48, 48, 48, 48);\n'
              '    TextView title = new TextView(this);\n'
              '    title.setText("ApexPS5");\n'
              '    title.setTextColor(Color.WHITE);\n'
              '    title.setTextSize(28);\n'
              '    title.setGravity(Gravity.CENTER);\n'
              '    rootLayout.addView(title);\n'
              '    statusText = new TextView(this);\n'
              '    statusText.setText("Ready - Select a custom wallpaper or load eboot.bin");\n'
              '    statusText.setTextColor(Color.parseColor("#9FB3D8"));\n'
              '    statusText.setTextSize(15);\n'
              '    statusText.setGravity(Gravity.CENTER);\n'
              '    statusText.setPadding(0, 24, 0, 48);\n'
              '    rootLayout.addView(statusText);\n'
              '    Button bgBtn = new Button(this);\n'
              '    bgBtn.setText("Select Custom Background");\n'
              '    bgBtn.setOnClickListener(v -> {\n'
              '      Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n'
              '      intent.addCategory(Intent.CATEGORY_OPENABLE);\n'
              '      intent.setType("image/*");\n'
              '      startActivityForResult(intent, 101);\n'
              '    });\n'
              '    rootLayout.addView(bgBtn);\n'
              '    Button binBtn = new Button(this);\n'
              '    binBtn.setText("Load PS5 Binary (eboot.bin)");\n'
              '    binBtn.setOnClickListener(v -> {\n'
              '      Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n'
              '      intent.addCategory(Intent.CATEGORY_OPENABLE);\n'
              '      intent.setType("*/*");\n'
              '      startActivityForResult(intent, 102);\n'
              '    });\n'
              '    rootLayout.addView(binBtn);\n'
              '    setContentView(rootLayout);\n'
              '  }\n'
              '  @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {\n'
              '    if (resultCode != RESULT_OK || data == null || data.getData() == null) return;\n'
              '    Uri uri = data.getData();\n'
              '    try (InputStream is = getContentResolver().openInputStream(uri)) {\n'
              '      if (requestCode == 101) {\n'
              '        Bitmap bmp = BitmapFactory.decodeStream(is);\n'
              '        rootLayout.setBackground(new BitmapDrawable(getResources(), bmp));\n'
              '        statusText.setText("Custom Background Updated!");\n'
              '      } else if (requestCode == 102) {\n'
              '        ByteArrayOutputStream buffer = new ByteArrayOutputStream();\n'
              '        int b;\n'
              '        while ((b = is.read()) != -1) buffer.write(b);\n'
              '        statusText.setText(inspectBinary(buffer.toByteArray()));\n'
              '      }\n'
              '    } catch (Exception e) {\n'
              '      statusText.setText("Error: " + e.getMessage());\n'
              '    }\n'
              '  }\n'
              '}\n'
          )
          PY

      - name: Build Debug APK
        run: |
          cd android-app
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexPS5-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
