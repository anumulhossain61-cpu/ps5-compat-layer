name: Build ApexPS5 Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Native Android App
        run: |
          mkdir -p android-app/app/src/main/java/com/apex/ps5
          mkdir -p android-app/app/src/main/cpp

          printf 'rootProject.name = "ApexPS5"\ninclude ":app"\n' > android-app/settings.gradle

          printf 'buildscript {\n  repositories { google(); mavenCentral() }\n  dependencies { classpath "com.android.tools.build:gradle:8.2.2" }\n}\nallprojects {\n  repositories { google(); mavenCentral() }\n}\n' > android-app/build.gradle

          printf 'plugins { id "com.android.application" }\nandroid {\n  namespace "com.apex.ps5"\n  compileSdk 34\n  defaultConfig {\n    applicationId "com.apex.ps5"\n    minSdk 26\n    targetSdk 34\n    versionCode 1\n    versionName "1.0"\n  }\n  externalNativeBuild {\n    cmake { path "src/main/cpp/CMakeLists.txt" }\n  }\n}\n' > android-app/app/build.gradle

          printf '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://android.com">\n  <application android:label="ApexPS5" android:theme="@android:style/Theme.Material.NoActionBar">\n    <activity android:name=".MainActivity" android:exported="true">\n      <intent-filter>\n        <action android:name="android.intent.action.MAIN" />\n        <category android:name="android.intent.category.LAUNCHER" />\n      </intent-filter>\n    </activity>\n  </application>\n</manifest>\n' > android-app/app/src/main/AndroidManifest.xml

          printf 'cmake_minimum_required(VERSION 3.22.1)\nproject("apexps5")\nadd_library(apexps5 SHARED native-lib.cpp)\nfind_library(log-lib log)\ntarget_link_libraries(apexps5 ${log-lib})\n' > android-app/app/src/main/cpp/CMakeLists.txt

          cat << 'EOF' > android-app/app/src/main/cpp/native-lib.cpp
          #include <jni.h>
          #include <string>
          #include <sstream>
          #include <cstdint>

          extern "C" JNIEXPORT jstring JNICALL
          Java_com_apex_ps5_MainActivity_inspectBinary(JNIEnv* env, jobject, jbyteArray data) {
              jsize len = env->GetArrayLength(data);
              if (len < 64) return env->NewStringUTF("Error: File too small to be a PS5 ELF binary.");

              jbyte* bytes = env->GetByteArrayElements(data, nullptr);
              uint32_t magic = *reinterpret_cast<uint32_t*>(bytes);
              uint64_t entry = *reinterpret_cast<uint64_t*>(bytes + 24);
              uint16_t phnum = *reinterpret_cast<uint16_t*>(bytes + 56);
              env->ReleaseByteArrayElements(data, bytes, JNI_ABORT);

              if (magic != 0x464C457F) {
                  return env->NewStringUTF("Invalid or encrypted binary (Expected unencrypted ELF).");
              }

              std::ostringstream out;
              out << "Valid PS5 ELF Loaded!\nEntry Point: 0x" << std::hex << entry
                  << "\nProgram Segments: " << std::dec << phnum;
              return env->NewStringUTF(out.str().c_str());
          }
          EOF

          cat << 'EOF' > android-app/app/src/main/java/com/apex/ps5/MainActivity.java
          package com.apex.ps5;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Color;
          import android.graphics.drawable.BitmapDrawable;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;

          public class MainActivity extends Activity {
              static { System.loadLibrary("apexps5"); }
              public native String inspectBinary(byte[] data);

              private LinearLayout rootLayout;
              private TextView statusText;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  rootLayout = new LinearLayout(this);
                  rootLayout.setOrientation(LinearLayout.VERTICAL);
                  rootLayout.setGravity(Gravity.CENTER);
                  rootLayout.setBackgroundColor(Color.parseColor("#0B0F1A"));
                  rootLayout.setPadding(48, 48, 48, 48);

                  TextView title = new TextView(this);
                  title.setText("ApexPS5");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(28);
                  title.setGravity(Gravity.CENTER);
                  rootLayout.addView(title);

                  statusText = new TextView(this);
                  statusText.setText("Ready - Select a custom wallpaper or load eboot.bin");
                  statusText.setTextColor(Color.parseColor("#9FB3D8"));
                  statusText.setTextSize(15);
                  statusText.setGravity(Gravity.CENTER);
                  statusText.setPadding(0, 24, 0, 48);
                  rootLayout.addView(statusText);

                  Button bgBtn = new Button(this);
                  bgBtn.setText("Select Custom Background");
                  bgBtn.setOnClickListener(v -> {
                      Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                      intent.addCategory(Intent.CATEGORY_OPENABLE);
                      intent.setType("image/*");
                      startActivityForResult(intent, 101);
                  });
                  rootLayout.addView(bgBtn);

                  Button binBtn = new Button(this);
                  binBtn.setText("Load PS5 Binary (eboot.bin)");
                  binBtn.setOnClickListener(v -> {
                      Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                      intent.addCategory(Intent.CATEGORY_OPENABLE);
                      intent.setType("*/*");
                      startActivityForResult(intent, 102);
                  });
                  rootLayout.addView(binBtn);

                  setContentView(rootLayout);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (resultCode != RESULT_OK || data == null || data.getData() == null) return;
                  Uri uri = data.getData();
                  try (InputStream is = getContentResolver().openInputStream(uri)) {
                      if (requestCode == 101) {
                          Bitmap bmp = BitmapFactory.decodeStream(is);
                          rootLayout.setBackground(new BitmapDrawable(getResources(), bmp));
                          statusText.setText("Custom Background Updated!");
                      } else if (requestCode == 102) {
                          ByteArrayOutputStream buffer = new ByteArrayOutputStream();
                          int b;
                          while ((b = is.read()) != -1) buffer.write(b);
                          statusText.setText(inspectBinary(buffer.toByteArray()));
                      }
                  } catch (Exception e) {
                      statusText.setText("Error: " + e.getMessage());
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          cd android-app
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexPS5-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
