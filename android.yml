name: Build PS5 Emulator Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Native Android Project
        run: |
          mkdir -p android-app/app/src/main/java/com/ps5/compat
          mkdir -p android-app/app/src/main/cpp
          cp main.cpp android-app/app/src/main/cpp/native-lib.cpp

          cat << 'EOF' > android-app/settings.gradle
          rootProject.name = "PS5CompatLayer"
          include ':app'
          EOF

          cat << 'EOF' > android-app/build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          cat << 'EOF' > android-app/app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.ps5.compat'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ps5.compat"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              externalNativeBuild {
                  cmake { path "src/main/cpp/CMakeLists.txt" }
              }
          }
          EOF

          cat << 'EOF' > android-app/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://android.com">
              <application android:label="PS5 Compat Layer" android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Build Debug APK
        run: |
          cd android-app
          gradle wrapper
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS5CompatLayer-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
